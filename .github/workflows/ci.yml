name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hr
          POSTGRES_PASSWORD: hr
          POSTGRES_DB: hr
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hr" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit + API tests (SQLite)
        run: pytest -q
      - name: Smoke test on PostgreSQL + pgvector
        env:
          DATABASE_URL: postgresql+psycopg://hr:hr@localhost:5432/hr
        run: python -m scripts.smoke_pg
      - name: Eval (baseline)
        run: python -m eval.run_eval
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: backend/eval/results/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose build
