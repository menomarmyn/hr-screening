# Render Blueprint: сайт + API одним сервисом и Postgres с pgvector. Всё на бесплатном тарифе.
services:
  - type: web
    name: koz-careers
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: koz-careers-db
          property: connectionString
      - key: LLM_PROVIDER
        value: mock
      - key: CELERY_EAGER
        value: "true"
      - key: REDIS_URL
        value: redis://127.0.0.1:6379/0
      - key: INTEGRATIONS_DRY_RUN
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: API_KEY
        generateValue: true
      - key: HR_INVITE_CODE
        generateValue: true

databases:
  - name: koz-careers-db
    plan: free
    databaseName: hr
    user: hr
